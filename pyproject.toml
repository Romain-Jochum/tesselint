[project]
name = "tesselint"
dynamic = ["version"]
description = "Finds duplicate, overlapping and bundled user stories in a backlog with Jev pairwise decisions, plus a local review UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Romain Jochum" }]
keywords = [
    "user-stories",
    "backlog",
    "requirements",
    "duplicate-detection",
    "llm",
    "openrouter",
    "product-management",
    "cli",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "model2vec>=0.9.0",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
tesselint = "tesselint.cli:main"

[project.urls]
Homepage = "https://github.com/Romain-Jochum/tesselint"
Repository = "https://github.com/Romain-Jochum/tesselint"
Issues = "https://github.com/Romain-Jochum/tesselint/issues"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tesselint/__init__.py"

# The wheel ships the whole package directory; the include list names the package data:
# synth seeds, the stories v1 schema (kept byte-equal to schemas/) and the built web UI.
[tool.hatch.build.targets.wheel]
packages = ["src/tesselint"]
include = [
    "src/tesselint/**/*.py",
    "src/tesselint/py.typed",
    "src/tesselint/data/*.toml",
    "src/tesselint/data/stories.v1.schema.json",
    "src/tesselint/server/static/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# internal/ holds contributor notes and one-off probe scripts, not package code.
extend-exclude = ["internal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["tesselint", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "model2vec",
    "model2vec.*",
    "scipy",
    "scipy.*",
    "aiolimiter",
    "aiolimiter.*",
    # jsonschema ships no py.typed (docs/ui/DESIGN.md §4.5 dependency)
    "jsonschema",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: real Jev calls through OpenRouter; costs money; opt in with -m live",
    "slow: downloads the model2vec model (minishlab/potion-retrieval-32M)",
]
