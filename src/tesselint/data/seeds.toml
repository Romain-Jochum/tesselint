# Hand-written ground-truth seeds for the tesselint synthetic generator (DESIGN.md §6).
# Each seed is one atomic capability. `paraphrase` is a same-scope rewrite (a planted duplicate);
# `addon` is an extra same-area capability (seed + addon = a container that contains the seed).
version = 1
domain = "Plotline, an app for a city allotment society that runs 14 sites: waiting lists, shared tools, water, compost, produce swaps, work parties, rent and inspections."

[epics]
E1 = "Waiting list and plot allocation"
E2 = "Tool shed lending"
E3 = "Water supply and irrigation"
E4 = "Produce and seed sharing"
E5 = "Compost and green waste"
E6 = "Work parties and volunteering"
E7 = "Rent, deposits and payments"
E8 = "Site rules and inspections"

# ---------------------------------------------------------------- E1

[[seed]]
id = "S01"
epic = "E1"
title = "Join the plot waiting list"
tag = "MVP"
core = "I join the waiting list for one or more garden sites from my phone, so that I get a plot without queuing at the council office."
subs = ["I can pick up to three sites and rank them.", "Proof that I live in the borough is required; a council tax bill or tenancy agreement works."]
paraphrase = { title = "Sign up for an allotment queue", core = "I put my name down for whichever allotment locations suit me using the mobile app, so that getting a patch doesn't mean standing in line at the town hall.", subs = ["Up to three locations may be chosen, in order of preference.", "I must show I'm a local resident, with a lease or a rates statement."] }

[[seed]]
id = "S02"
epic = "E1"
title = "See my place in the queue"
tag = "MVP+"
core = "I see my current position on each waiting list and a rough estimate of the wait, so that I can decide whether to stay or try another site."
subs = ["The estimate is based on how many plots at that site came free over the last two years."]
addon = { title = "Queue position and progress messages", alone_title = "Waiting list move-up messages", core = "I also get a message whenever I move up ten places or more on any list.", subs = ["I can turn these messages off."] }

